<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Threadveil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 420px;
      max-height: 620px;
      margin: 0;
      overflow-y: auto;
      background: #101418;
      color: #e7edf2;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    .header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(16, 20, 24, 0.96);
      border-bottom: 1px solid #27313a;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 16px; }
    .brand-mark {
      width: 24px; height: 24px; border-radius: 7px;
      background: linear-gradient(145deg, #2dd4bf, #38bdf8);
      position: relative;
    }
    .brand-mark::after {
      content: ""; position: absolute; inset: 6px 7px 6px 7px;
      border: 2px solid #081018; border-top: 0; transform: rotate(45deg);
    }
    .section { padding: 14px 16px; border-bottom: 1px solid #27313a; }
    .section-title {
      display: flex; align-items: center; justify-content: space-between;
      color: #a7b4c0; font-size: 12px; font-weight: 700; margin-bottom: 10px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; }
    .hint { color: #7d8b97; font-size: 12px; margin-top: 6px; }
    .switch { position: relative; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; cursor: pointer; background: #33414d; border-radius: 999px; transition: .18s; }
    .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .18s; }
    .switch input:checked + .slider { background: #14b8a6; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    input[type="range"] { width: 180px; accent-color: #14b8a6; }
    input[type="number"], input[type="text"], select, textarea {
      width: 100%;
      border: 1px solid #34414d;
      border-radius: 6px;
      background: #161d23;
      color: #e7edf2;
      padding: 7px 9px;
      outline: none;
    }
    input[type="number"] { width: 72px; text-align: center; }
    textarea { min-height: 92px; resize: vertical; font-family: "SF Mono", Consolas, monospace; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field label { display: block; color: #a7b4c0; font-size: 12px; margin-bottom: 5px; }
    .btn {
      border: 0;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e7edf2;
      background: #25313b;
      cursor: pointer;
      font-weight: 650;
    }
    .btn:hover { background: #314250; }
    .btn-primary { background: #0f766e; }
    .btn-primary:hover { background: #0d9488; }
    .btn-danger { color: #fecdd3; background: #4c1d25; }
    .btn-danger:hover { background: #7f1d1d; }
    .btn-link { color: #5eead4; background: transparent; padding: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 8px; border: 1px solid #34414d; border-radius: 999px; background: #161d23; }
    .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag button, .icon-btn { border: 0; color: #7d8b97; background: transparent; cursor: pointer; padding: 0 2px; }
    .tag button:hover, .icon-btn:hover { color: #fb7185; }
    .rule-item, .weight-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 0; border-bottom: 1px solid rgba(52, 65, 77, 0.5);
    }
    .rule-item:last-child, .weight-row:last-child { border-bottom: 0; }
    .rule-pattern, .weight-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rule-type { color: #5eead4; width: 42px; flex: none; font-size: 12px; }
    .weight-row input[type="range"] { width: 96px; }
    .weight-val { width: 18px; text-align: right; color: #5eead4; font-weight: 700; }
    details summary { cursor: pointer; color: #c8d3dc; font-weight: 700; }
    details + details { margin-top: 12px; }
    .footer { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand"><span class="brand-mark"></span><span>Threadveil</span></div>
    <label class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></label>
  </div>

  <div class="section">
    <div class="section-title">基础</div>
    <div class="row">
      <span>启发式过滤</span>
      <label class="switch"><input type="checkbox" id="useHeuristic"><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>调试模式</span>
      <label class="switch"><input type="checkbox" id="debug"><span class="slider"></span></label>
    </div>
    <div class="row">
      <span>屏蔽阈值</span>
      <input type="range" id="threshold" min="3" max="12" step="1">
      <strong id="thresholdVal">5</strong>
    </div>
  </div>

  <div class="section">
    <div class="section-title">关键词</div>
    <div class="row">
      <input type="text" id="kwInput" placeholder="例如：私信、看主页、线下">
      <button class="btn btn-primary" id="addKw">添加</button>
    </div>
    <div class="tags" id="kwTags"></div>
  </div>

  <div class="section">
    <div class="section-title">自定义规则</div>
    <div class="row">
      <select id="ruleType">
        <option value="username">用户名</option>
        <option value="text">正文</option>
        <option value="bio">简介</option>
      </select>
      <input type="text" id="rulePattern" placeholder="正则表达式">
      <button class="btn btn-primary" id="addRule">添加</button>
    </div>
    <label class="hint"><input type="checkbox" id="caseSensitive"> 区分大小写</label>
    <div id="rulesList"></div>
  </div>

  <div class="section">
    <div class="section-title">默认规则库 <button class="btn-link" id="resetRuleConfig">恢复默认</button></div>
    <details open>
      <summary>参数</summary>
      <div class="grid" style="margin-top:10px">
        <div class="field"><label>短句字符数</label><input type="number" id="shortReplyMaxChars" min="1" max="40"></div>
        <div class="field"><label>短链接字符数</label><input type="number" id="anyLinkMaxChars" min="1" max="200"></div>
        <div class="field"><label>大量 emoji 数</label><input type="number" id="emojiOverloadMin" min="1" max="60"></div>
        <div class="field"><label>emoji 轰炸数</label><input type="number" id="emojiBombMin" min="1" max="30"></div>
        <div class="field"><label>emoji 轰炸长度</label><input type="number" id="emojiBombMaxChars" min="1" max="300"></div>
        <div class="field"><label>高密度 emoji 数</label><input type="number" id="highEmojiDensityMin" min="1" max="30"></div>
        <div class="field"><label>高密度比例</label><input type="number" id="highEmojiDensityRatio" min="0.05" max="1" step="0.05"></div>
        <div class="field"><label>引流 @ 长度</label><input type="number" id="promotionMentionMaxChars" min="1" max="300"></div>
      </div>
    </details>
    <details>
      <summary>外链域名/规则</summary>
      <textarea id="externalLinkPatterns"></textarea>
      <label class="hint"><input type="checkbox" id="useDefaultExternalLinks"> 保留内置外链规则</label>
    </details>
    <details>
      <summary>模板短语</summary>
      <textarea id="templatePhrases"></textarea>
      <label class="hint"><input type="checkbox" id="useDefaultTemplates"> 保留内置模板规则</label>
    </details>
    <details>
      <summary>模板正则</summary>
      <textarea id="templateRegexes"></textarea>
    </details>
    <details>
      <summary>敏感词库</summary>
      <textarea id="extremeKeywords"></textarea>
      <label class="hint"><input type="checkbox" id="useDefaultExtremeKeywords"> 保留内置敏感词</label>
    </details>
    <details>
      <summary>暗示性 emoji</summary>
      <input type="text" id="suggestiveEmojiChars">
    </details>
  </div>

  <div class="section">
    <div class="section-title">规则权重 <button class="btn-link" id="resetWeights">恢复默认</button></div>
    <div id="weightsList"></div>
  </div>

  <div class="footer">
    <button class="btn" id="exportConfig">导出</button>
    <button class="btn" id="importConfig">导入</button>
    <input type="file" id="importFile" accept=".json" hidden>
    <button class="btn btn-danger" id="clearAll">清空</button>
  </div>

  <script src="rules-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
